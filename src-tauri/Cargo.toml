[package]
name = "textscribe"
version = "0.1.0"
description = "Ein minimalistischer Texteditor"
authors = ["Tobi"]
edition = "2021"

[lib]
name = "textscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5.0"

